name: codequant_aos_deepseek
title: CodeQuant AOS (DeepSeek-V2-Lite)
description: CodeQuant's activation-outlier-smoothing rotation for DeepSeek-V2-Lite (the released DeepSeek settings), a residual rotation R1 trained with Adam on a Cayley parametrization to minimise the 4-bit per-token activation quantization error of the normalized residual-stream outputs, after folding the RMSNorm gains into the next linears.
paper: {title: "CodeQuant: Unified Clustering and Quantization for Enhanced Outlier Smoothing in Low-Precision Mixture-of-Experts", arxiv: "2604.10496", official_repo: "https://github.com/SAI-Lab-NYU/CodeQuant@c149bc94"}
# Released-code behaviour, reproduced: R1 only (no R2, no online Hadamard); every row of the calibration set counts,
# padding tokens included; the loss is taken on the model with the gains folded, in the model dtype (official: the same
# model, the rotation applied in float32 in the hook). Deviations: init_seed is 42 as the official global seed, but the
# official draws R's initial weight after model loading from a global RNG whose state is not reproduced, so the
# trajectories are not bit-identical.
quantizers: {}
values:
  preprocess.steps:
    value:
      - kind: rotation
        entries:
          - position: residual
            layers: all
            mode: offline
            source:
              type: trained
              objective: act_quant_mse
              act: {type: int, bits: 4, symmetric: false, granularity: per_token, zero_point: float}
              optimizer: adam
              lr: 0.0001
              init_seed: 42
              calibration:
                dataset: Self-GRIT/wikitext-2-raw-v1-preprocessed
                split: train
                n_samples: 1024
                batch_size: 32
                max_length: 256
                epochs: 16
                shuffle_seed: 42
                chat_template: true
                enable_thinking: null
                padding: longest
            options: {untie_embeddings: true}
    source: "code: configs/deepseek.yaml#L22-L27 (1024 samples, batch 32, max_length 256, 16 epochs, lr 1e-4), script/rotation_fine_tune_script.py#L22-L57 (loss hook), #L60-L148 (loop: chat template of the processor without enable_thinking, padding=True, DataLoader seed 42, Adam), utils/rotation_utils.py#L7-L27 (Cayley R1), #L410-L513 (gain folding), script/rotation_fine_tune_script.py#L160-L163 (seed 42)"
