# Deviations from the official code, all intended: calibration is wikitext2 text with the full-sequence causal-LM
# loss (the official code calibrates on ScienceQA image-question prompts); the model runs in its registered dtype
# (bfloat16) instead of float16; head_dim comes from the model config (the official code assumes hidden // heads,
# which is wrong for Qwen3); the input Gram comes from a full forward pass instead of the layer-by-layer replay;
# eval mode instead of train mode (no dropout in Qwen3); a Gram that is not positive definite, or a projection
# that keeps no singular value in a layer, is an error (official: silent eigenvalue shift or a dense fallback);
# the per-head floor of one singular value and the clamp of k to the pool size are kept as released.
# tasks: text-only perplexity replaces the paper's VLM benchmarks (no source in the code).
# The released 16-bit setting (fp16.sh): per-head q/k/v decomposition only, no quantization, no hybrid FFN.
method: lsvd
name: paper_noq
description: LSVD decomposition only, without quantization (the released LSVD-noQ setting, rank ratio 0.5, no quantization-aware whitening, no hybrid FFN); no preprocess is needed.
paper: {title: "LSVD: Loss-Aware Low-Rank Approximation for Efficient Low-Precision Vision-Language Models", arxiv: "2606.00573", official_repo: "https://github.com/SAI-Lab-NYU/LSVD@f5675bd02af1d0ed047eb733dc1e72256d4408a6"}
values:
  method.config.rules:
    value: []
    source: "code: scripts/lsvd/fp16.sh#L25-L38 (--w_bits 16 --a_bits 16: nothing is quantized)"
  method.config.calibration.dataset:
    value: wikitext2
    source: "code: fake_quant/utils/data_utils.py#L29-L51 (deviation: text-only, get_wikitext2 replaces ScienceQA_Train)"
  method.config.calibration.n_samples:
    value: 256
    source: "code: scripts/lsvd/fp16.sh#L25-L38 and w8a8.sh#L47-L67 (--nsamples 256)"
  method.config.calibration.seqlen:
    value: 2048
    source: "code: fake_quant/utils/data_utils.py#L29-L51 (deviation: text-only, the window length is the loader's seqlen argument)"
  method.config.calibration.seed:
    value: 0
    source: "code: scripts/lsvd/fp16.sh#L25-L38 (SEED default 0, --seed)"
  method.config.decomposition.rank_ratio:
    value: 0.5
    source: "code: scripts/lsvd/fp16.sh#L25-L38 and w8a8.sh#L47-L67 (RATIO default 0.5, --rank_ratio, --use_true_param_ratio), grad_info_utils.py#L2698-L2721"
  method.config.decomposition.beta:
    value: 0.0
    source: "code: scripts/lsvd/fp16.sh#L25-L38 (--svd_mode U), svd_utils.py#L1522-L1695"
  method.config.decomposition.grad_alpha:
    value: 1.0
    source: "code: fake_quant/utils/utils.py#L623 (--grad_alpha default 1.0)"
  method.config.decomposition.score_dtype:
    value: bfloat16
    source: "code: grad_info_utils.py#L2326-L2347 (importance scores in bfloat16) and #L948-L1017 (gradient projection and accumulation in bfloat16)"
  method.config.decomposition.rank_pools:
    value: per_projection
    source: "code: grad_info_utils.py#L2780-L2943 (separate q/k/v pools unless --truncate_mixed_qkv_budget)"
  method.config.decomposition.k_grad_normalisation:
    value: twice
    source: "code: grad_info_utils.py#L1395-L1412 (k_proj.S_grad_info is divided by the batch count and square-rooted once on its own and once more in the q/k/v loop)"
  method.config.decomposition.qaw:
    value: false
    source: "code: scripts/lsvd/fp16.sh#L25-L38 (no --act_calib_fake_quant), fake_quant/utils/utils.py#L510"
  tasks:
    value: [native/wikitext2_ppl, native/c4_ppl]
    source: "assumed"
