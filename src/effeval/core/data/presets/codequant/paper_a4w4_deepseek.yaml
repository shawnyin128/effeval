method: codequant
name: paper_a4w4_deepseek
description: CodeQuant A4W4 on DeepSeek-V2-Lite with the released code's settings (learning rate 1e-3, routed experts and router not trained). The site names of the DeepSeek layout are provisional until that architecture is extracted. To be combined with the codequant_aos_deepseek preprocess preset.
paper: {title: "CodeQuant: Unified Clustering and Quantization for Enhanced Outlier Smoothing in Low-Precision Mixture-of-Experts", arxiv: "2604.10496", official_repo: "https://github.com/SAI-Lab-NYU/CodeQuant@c149bc94"}
# Released-code behaviour, reproduced: k-means runs in float32 before the cast to the model dtype; the hub modeling_deepseek.py runs the routed experts under no_grad and the router
# KL uses the original gate weight, so routed experts and the router keep their k-means centroids (route_gradients
# false) while q_proj, kv_a_proj_with_mqa and the shared experts are fine-tuned. Not reproduced: the dense layer-0 MLP is
# k-means only in the released code (no loss reaches it) but is fine-tuned here with the local loss.
values:
  method.config.rules:
    value:
      - sites: [linear.attn.q_proj.weight, linear.attn.kv_a_proj_with_mqa.weight, moe.router.weight, linear.mlp.gate_proj.weight, linear.mlp.up_proj.weight, linear.mlp.shared_experts.gate_proj.weight, linear.mlp.shared_experts.up_proj.weight, linear.mlp.experts.gate_proj.weight, linear.mlp.experts.up_proj.weight]
        layers: all
        quant: {type: codebook, centroids: 16, granularity: per_channel, kmeans: {iters: 300, tol: 1.0e-6, seed: 42, compute_dtype: float32}}
      - sites: [linear.attn.q_proj.input, linear.attn.kv_a_proj_with_mqa.input, moe.router.input, linear.mlp.gate_proj.input, linear.mlp.up_proj.input, linear.mlp.shared_experts.gate_proj.input, linear.mlp.shared_experts.up_proj.input, linear.mlp.experts.gate_proj.input, linear.mlp.experts.up_proj.input]
        layers: all
        quant: {type: int, bits: 4, symmetric: false, granularity: per_token, zero_point: float}
    source: "code: configs/deepseek.yaml#L15-L18 (cluster_num 16, group sizes -1, activation bits 4), script/cluster_fine_tune_script.py#L101-L218 (DeepSeek clustered linears), cluster/ClusterLinear.py#L29-L33 (the module is built in float32 and its weight copied in), #L56 and #L77-L91 (k-means per row on that float32 weight, before the cast to the model dtype at script/cluster_fine_tune_script.py#L210), utils/evaluation_utils.py#L93-L100 (activation sites)"
  method.config.accf.calibration.dataset:
    value: Self-GRIT/wikitext-2-raw-v1-preprocessed
    source: "code: configs/deepseek.yaml#L11-L12"
  method.config.accf.calibration.split:
    value: train
    source: "code: utils/dataset_utils.py#L6-L20 (train split, first max_sample rows)"
  method.config.accf.calibration.n_samples:
    value: 512
    source: "code: configs/deepseek.yaml#L21 (cluster.max_sample 512)"
  method.config.accf.calibration.batch_size:
    value: 32
    source: "code: configs/deepseek.yaml#L22 (cluster.batch_size 32)"
  method.config.accf.calibration.max_length:
    value: 256
    source: "code: configs/deepseek.yaml#L23 (cluster.max_length 256)"
  method.config.accf.calibration.epochs:
    value: 4
    source: "code: configs/deepseek.yaml#L24 (cluster.epochs 4)"
  method.config.accf.calibration.shuffle_seed:
    value: 42
    source: "code: script/cluster_fine_tune_script.py#L322-L324 (DataLoader shuffle with generator seed 42)"
  method.config.accf.calibration.chat_template:
    value: true
    source: "code: script/cluster_fine_tune_script.py#L348-L359 (each row is one user turn of the processor's chat template)"
  method.config.accf.calibration.padding:
    value: longest
    source: "code: script/cluster_fine_tune_script.py#L359 (padding=True)"
  method.config.accf.lr:
    value: 0.001
    source: "code: configs/deepseek.yaml#L25 (cluster.fine_tune_lr 1e-3)"
  method.config.accf.kl_weight:
    value: 1.0
    source: "code: cluster/ClusterMoE.py#L116 (loss = loss_hidden + loss_router)"
  method.config.accf.train_dtype:
    value: model
    source: "code: script/cluster_fine_tune_script.py#L210 (every ClusterLinear tensor is cast to the model dtype, so the centroid SGD runs in bf16 on these checkpoints)"
  method.config.accf.route_gradients:
    value: false
    source: "code: cluster/ClusterMoE.py#L91-L93 (router logits from the original gate weight; the hub DeepseekV2MoE.moe_infer is under no_grad)"
  tasks:
    value: [native/wikitext2_preprocessed_ppl, native/c4_ppl]
    source: "paper §4 Table 1 (WikiText2 and C4 perplexity)"
