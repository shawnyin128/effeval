name: gptq
title: GPTQ
version: '1'
field: quantization
runtime: hf
entry: effeval.methods.quantization.gptq:gptq
capabilities:
  modes: []
  handles:
  - in_process
uses:
- quant_rules
- calibration
architectures: null
config_schema:
  $defs:
    Calibration:
      additionalProperties: false
      description: 'Calibration data drawn from a corpus.


        `windows` (c4, wikitext2): n_samples random token windows of seqlen tokens,
        drawn with `seed`.

        `documents` (pile_val): the first n_samples documents of the corpus shuffled
        with `seed`, one per

        forward pass, each truncated to seqlen tokens (SmoothQuant).

        `concat_blocks` (pile_val): n_samples documents of at most seqlen tokens after
        shuffling with `seed`,

        concatenated and cut into blocks of seqlen tokens (AWQ).

        `random_crop` (pile_val): the documents shuffled with `seed`, taken in order
        and skipping empty ones, a

        document longer than seqlen cropped to seqlen tokens at an offset drawn uniformly
        from

        `random.Random(seed)`, shorter documents kept whole, until n_samples documents
        and n_samples * seqlen

        tokens are collected; all

        concatenated, cut into blocks of seqlen tokens, the first n_samples blocks
        kept (QServe / deepcompressor).'
      properties:
        dataset:
          description: Corpus the calibration data is drawn from.
          enum:
          - c4
          - wikitext2
          - pile_val
          title: Dataset
          type: string
        n_samples:
          description: Number of windows (windows) or documents (the other modes).
          minimum: 1
          title: N Samples
          type: integer
        seqlen:
          description: Tokens per window, truncated document or block.
          minimum: 8
          title: Seqlen
          type: integer
        seed:
          description: Seed for drawing the windows or shuffling the documents.
          title: Seed
          type: integer
        sampling:
          default: windows
          description: How the corpus becomes token sequences.
          enum:
          - windows
          - documents
          - concat_blocks
          - random_crop
          title: Sampling
          type: string
      required:
      - dataset
      - n_samples
      - seqlen
      - seed
      title: Calibration
      type: object
    ClipSearch:
      additionalProperties: false
      description: 'Per-unit search for the clipping ratio that minimises the weight
        reconstruction error.


        Candidates are p = 1 - i / grid for i in range(int(max_shrink * grid)); each
        shrinks the unit''s range to

        p of its min-max range, and the candidate with the smallest sum of |dequantized
        - original|^norm wins

        (the first one on ties). This is the `--w_clip` search of QuaRot (quant_utils.py
        `WeightQuantizer`) and

        of the GPTQ repository''s `mse` option.'
      properties:
        type:
          const: mse
          title: Type
          type: string
        grid:
          default: 100
          description: Resolution of the candidate ratios.
          minimum: 1
          title: Grid
          type: integer
        max_shrink:
          default: 0.8
          description: Largest shrink; candidates stop before 1 - max_shrink.
          exclusiveMinimum: 0.0
          maximum: 1.0
          title: Max Shrink
          type: number
        norm:
          default: 2.4
          description: Exponent of the error summed over a unit.
          exclusiveMinimum: 0.0
          title: Norm
          type: number
      required:
      - type
      title: ClipSearch
      type: object
    FpFormat:
      additionalProperties: false
      description: 'Low-precision float `eXmY` with a float32 scale `absmax / max_representable`
        per granularity unit.


        `special` selects which codes are reserved: `ieee` (inf/nan, e.g. e5m2), `fn`
        (only the all-ones code is

        NaN, e.g. e4m3fn), `none` (all codes finite, e.g. OCP FP6/FP4). `auto` picks
        ieee for e5m2, fn for e4m3

        and none otherwise.'
      properties:
        type:
          const: fp
          title: Type
          type: string
        encoding:
          description: 'eXmY: exponent and mantissa bits, e.g. e4m3, e2m1.'
          title: Encoding
          type: string
        special:
          default: auto
          description: 'Reserved codes: ieee inf/NaN, fn NaN only, none all finite.'
          enum:
          - auto
          - ieee
          - fn
          - none
          title: Special
          type: string
        granularity:
          description: 'Scale unit: per_tensor one scale, per_channel one per output
            row (weights), per_token one per vector (activations), per_group every
            group_size values.'
          enum:
          - per_tensor
          - per_channel
          - per_token
          - per_group
          title: Granularity
          type: string
        group_size:
          anyOf:
          - minimum: 1
            type: integer
          - type: 'null'
          default: null
          description: Values per scale when granularity is per_group.
          title: Group Size
        clip_ratio:
          default: 1.0
          description: Shrink the range to this fraction of absmax before rounding.
          exclusiveMinimum: 0.0
          maximum: 1.0
          title: Clip Ratio
          type: number
        group_axis:
          anyOf:
          - enum:
            - channel
            - token
            type: string
          - type: 'null'
          default: null
          description: 'Axis a per_group scale unit spans. channel (default): group_size
            consecutive features of one token. token: group_size consecutive tokens
            of one feature. Sequence-shaped sites only.'
          title: Group Axis
        residual:
          anyOf:
          - minimum: 1
            type: integer
          - type: 'null'
          default: null
          description: Keep the most recent residual tokens in full precision; only
            older tokens are quantized. With group_axis token the quantized span is
            cut to whole groups. Sequence-shaped sites only.
          title: Residual
      required:
      - type
      - encoding
      - granularity
      title: FpFormat
      type: object
    IntFormat:
      additionalProperties: false
      description: 'Uniform integer grid.


        Asymmetric: min-max range that always contains zero, zero point `round(-min
        / scale)`; this is exactly the

        grid of the official GPTQ code (quant.py `Quantizer.find_params`) and the
        paper''s RTN baseline.

        Symmetric: `scale = absmax / (2^(bits-1) - 1)`, codes clamped to [-2^(bits-1),
        2^(bits-1) - 1].'
      properties:
        type:
          const: int
          title: Type
          type: string
        bits:
          description: Integer bit width.
          maximum: 8
          minimum: 2
          title: Bits
          type: integer
        symmetric:
          description: 'Symmetric: scale = absmax / (2^(bits-1) - 1). Asymmetric:
            min-max grid, zero point.'
          title: Symmetric
          type: boolean
        granularity:
          description: 'Scale unit: per_tensor one scale, per_channel one per output
            row (weights), per_token one per vector (activations), per_group every
            group_size values.'
          enum:
          - per_tensor
          - per_channel
          - per_token
          - per_group
          title: Granularity
          type: string
        group_size:
          anyOf:
          - minimum: 1
            type: integer
          - type: 'null'
          default: null
          description: Values per scale when granularity is per_group.
          title: Group Size
        clip_ratio:
          default: 1.0
          description: Shrink the range to this fraction of absmax before rounding.
          exclusiveMinimum: 0.0
          maximum: 1.0
          title: Clip Ratio
          type: number
        clip_search:
          anyOf:
          - $ref: '#/$defs/ClipSearch'
          - type: 'null'
          default: null
          description: 'Weights only: search each scale unit''s clipping ratio by
            reconstruction error instead of using clip_ratio.'
        zero_point:
          anyOf:
          - enum:
            - integer
            - float
            type: string
          - type: 'null'
          default: null
          description: 'Asymmetric only. integer (default): the range always contains
            zero and the zero point is an integer. float: the grid spans exactly [min,
            max] of the unit, offset by min.'
          title: Zero Point
        group_axis:
          anyOf:
          - enum:
            - channel
            - token
            type: string
          - type: 'null'
          default: null
          description: 'Axis a per_group scale unit spans. channel (default): group_size
            consecutive features of one token. token: group_size consecutive tokens
            of one feature. Sequence-shaped sites only.'
          title: Group Axis
        residual:
          anyOf:
          - minimum: 1
            type: integer
          - type: 'null'
          default: null
          description: Keep the most recent residual tokens in full precision; only
            older tokens are quantized. With group_axis token the quantized span is
            cut to whole groups. Sequence-shaped sites only.
          title: Residual
      required:
      - type
      - bits
      - symmetric
      - granularity
      title: IntFormat
      type: object
    MxFormat:
      additionalProperties: false
      description: 'Block-scaled format along the last dimension.


        `scale: e8m0` follows the OCP Microscaling rule: shared scale `2^(floor(log2(block_absmax))
        - emax_elem)`.

        `scale: e4m3` follows the two-level NVFP4-style rule: a float32 tensor scale
        plus an e4m3 block scale.'
      properties:
        type:
          const: mx
          title: Type
          type: string
        element:
          description: Element format eXmY, e.g. e2m1 for MXFP4.
          title: Element
          type: string
        block_size:
          description: Values sharing one scale.
          minimum: 2
          title: Block Size
          type: integer
        scale:
          description: 'e8m0: OCP power-of-two scale. e4m3: NVFP4-style two-level
            scale.'
          enum:
          - e8m0
          - e4m3
          title: Scale
          type: string
      required:
      - type
      - element
      - block_size
      - scale
      title: MxFormat
      type: object
    QuantRule:
      additionalProperties: false
      description: Quantize the tensors at `sites` within `layers`; later rules override
        earlier ones at the same spot.
      properties:
        sites:
          description: Where to quantize, e.g. linear.*.weight, linear.mlp.*.input,
            attn.q.
          items:
            type: string
          minItems: 1
          title: Sites
          type: array
        layers:
          anyOf:
          - type: integer
          - type: string
          - items:
              anyOf:
              - type: integer
              - type: string
            type: array
          default: all
          description: 'Decoder layers: all, an index, a range 0-15, a list, or re:<regex>.'
          title: Layers
        quant:
          discriminator:
            mapping:
              fp: '#/$defs/FpFormat'
              int: '#/$defs/IntFormat'
              mx: '#/$defs/MxFormat'
            propertyName: type
          oneOf:
          - $ref: '#/$defs/IntFormat'
          - $ref: '#/$defs/FpFormat'
          - $ref: '#/$defs/MxFormat'
          title: Quant
      required:
      - sites
      - quant
      title: QuantRule
      type: object
  additionalProperties: false
  properties:
    rules:
      description: Weight rules (integer formats) are solved by GPTQ; rules on other
        sites follow.
      items:
        $ref: '#/$defs/QuantRule'
      minItems: 1
      title: Rules
      type: array
    act_order:
      title: Act Order
      type: boolean
    static_groups:
      title: Static Groups
      type: boolean
    percdamp:
      exclusiveMinimum: 0.0
      title: Percdamp
      type: number
    blocksize:
      minimum: 1
      title: Blocksize
      type: integer
    true_sequential:
      default: false
      description: Quantize each layer's linears in groups (k/v/q, o, up/gate, down),
        re-running the layer between groups so later groups see the quantized earlier
        ones, as the official `--true-sequential`.
      title: True Sequential
      type: boolean
    calibration:
      $ref: '#/$defs/Calibration'
  required:
  - rules
  - act_order
  - static_groups
  - percdamp
  - blocksize
  - calibration
  title: GPTQConfig
  type: object
display:
- rules
- act_order
default_preset: paper
custom_presets: {}
schema_hash: sha256:49566a775eaea511bd374a14e2c816343d65de4855d288ee474a5aba2175b2e3
builtin: true
description: GPTQ weight quantization (ported from the official implementation).
