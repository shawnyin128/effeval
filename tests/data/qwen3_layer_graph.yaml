# Hand-written expectation of the Qwen3 decoder-layer graph (plan section 1.3); test_introspect checks that
# extraction from the transformers Qwen3 classes reproduces it exactly.
version: 1
globals: {embedding: model.embed_tokens, final_norm: model.norm, lm_head: lm_head, norm_kind: rms}
nodes:
- {id: x_in, kind: residual}
- {id: input_layernorm, kind: norm, module: input_layernorm, block: attn, gain: true, axis: hidden}
- {id: q, kind: linear, module: self_attn.q_proj, canon: attn.q_proj, block: attn}
- {id: q_norm, kind: norm, module: self_attn.q_norm, block: attn, gain: true, axis: head_dim}
- {id: k, kind: linear, module: self_attn.k_proj, canon: attn.k_proj, block: attn}
- {id: k_norm, kind: norm, module: self_attn.k_norm, block: attn, gain: true, axis: head_dim}
- {id: v, kind: linear, module: self_attn.v_proj, canon: attn.v_proj, block: attn}
- {id: rope, kind: rope, block: attn}
- {id: qk, kind: matmul, block: attn, out_site: attn.scores}
- {id: softmax, kind: softmax, block: attn, out_site: attn.probs}
- {id: pv, kind: matmul, block: attn, out_site: attn.out}
- {id: o, kind: linear, module: self_attn.o_proj, canon: attn.o_proj, block: attn}
- {id: add1, kind: add}
- {id: post_attention_layernorm, kind: norm, module: post_attention_layernorm, block: mlp, gain: true, axis: hidden}
- {id: gate, kind: linear, module: mlp.gate_proj, canon: mlp.gate_proj, block: mlp}
- {id: act, kind: act, module: mlp.act_fn, block: mlp, fn: silu}
- {id: up, kind: linear, module: mlp.up_proj, canon: mlp.up_proj, block: mlp}
- {id: mul, kind: mul, block: mlp}
- {id: down, kind: linear, module: mlp.down_proj, canon: mlp.down_proj, block: mlp}
- {id: add2, kind: add}
edges:
- [x_in, input_layernorm, null]
- [input_layernorm, q, linear.attn.q_proj.input]
- [q, q_norm, null]
- [input_layernorm, k, linear.attn.k_proj.input]
- [k, k_norm, null]
- [input_layernorm, v, linear.attn.v_proj.input]
- [q_norm, rope, null]
- [k_norm, rope, null]
- [qk, softmax, attn.scores]
- [softmax, pv, attn.probs]
- [rope, qk, attn.q]
- [rope, qk, attn.k]
- [v, pv, attn.v]
- [pv, o, linear.attn.o_proj.input]
- [x_in, add1, null]
- [o, add1, null]
- [add1, post_attention_layernorm, null]
- [post_attention_layernorm, gate, linear.mlp.gate_proj.input]
- [gate, act, null]
- [post_attention_layernorm, up, linear.mlp.up_proj.input]
- [act, mul, null]
- [up, mul, null]
- [mul, down, linear.mlp.down_proj.input]
- [add1, add2, null]
- [down, add2, null]
