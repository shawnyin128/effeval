[project]
name = "effeval"
version = "0.1.0"
description = "Reusable evaluation infra for efficiency AI research (quantization, pruning, speculative decoding)"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "jsonschema>=4.21",
]

[project.optional-dependencies]
compute = [
    "torch>=2.4",
    "transformers>=5.0",
    "datasets>=3.0",
    "accelerate>=1.0",
    "lm-eval[hf]>=0.4.9",
    "evalscope>=1.0",
    "zstandard>=0.22",
]
server = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.9",
]
mcp = [
    "mcp>=2.2,<3",
]

[project.scripts]
effeval = "effeval.cli:main"

[project.entry-points."effeval.evaluators"]
evalscope = "effeval.evaluators.evalscope:EVALUATOR"
kernel = "effeval.evaluators.kernel:EVALUATOR"
lm_eval = "effeval.evaluators.lm_eval:EVALUATOR"
native = "effeval.evaluators.native:EVALUATOR"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "import-linter>=2.1",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/effeval"]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "compute: needs torch/transformers (compute extra)",
    "network: downloads datasets or models",
]

[tool.importlinter]
root_package = "effeval"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layered architecture"
type = "layers"
layers = [
    "effeval.cli",
    "effeval.mcp_server",
    "effeval.server",
    "effeval.api",
    "effeval.run | effeval.check",
    "effeval.preflight",
    "effeval.plan",
    "effeval.validate",
    "effeval.methods | effeval.evaluators",
    "effeval.ops | effeval.runtime | effeval.metrics | effeval.store",
    "effeval.core",
]

[[tool.importlinter.contracts]]
name = "Server never loads execution code (no torch on the server)"
type = "forbidden"
source_modules = ["effeval.server", "effeval.api.service", "effeval.mcp_server"]
forbidden_modules = [
    "effeval.api.execute",
    "effeval.run",
    "effeval.check",
    "effeval.methods",
    "effeval.evaluators",
    "effeval.runtime",
    "effeval.ops",
    "effeval.api.tasks",
    "torch",
    "transformers",
    "lm_eval",
    "evalscope",
    "datasets",
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Body"]
